
<!-- 🎧 DIGIY — Bouton flottant bienvenue inscription -->
<div class="digiy-floating-welcome" id="digiyFloatingWelcome">
  <button class="digiy-welcome-main" type="button" onclick="digiySpeakWelcome()">
    🎧 Bienvenue
  </button>

  <button class="digiy-welcome-stop" type="button" onclick="digiyStopWelcome()" aria-label="Stop audio">
    ⏹
  </button>
</div>

<style>
  .digiy-floating-welcome{
    position:fixed;
    right:18px;
    bottom:88px;
    z-index:99999;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,250,240,.97);
    border:1px solid rgba(184,134,11,.35);
    border-radius:999px;
    padding:8px;
    box-shadow:0 14px 38px rgba(35,28,10,.22);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  .digiy-welcome-main,
  .digiy-welcome-stop{
    border:0;
    cursor:pointer;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:900;
    border-radius:999px;
  }

  .digiy-welcome-main{
    background:#167a3f;
    color:#fff;
    padding:12px 16px;
    font-size:15px;
    box-shadow:0 8px 18px rgba(22,122,63,.25);
    white-space:nowrap;
  }

  .digiy-welcome-stop{
    background:#f3ead7;
    color:#3d321d;
    width:42px;
    height:42px;
    font-size:16px;
    flex:0 0 auto;
  }

  .digiy-welcome-main:active,
  .digiy-welcome-stop:active{
    transform:scale(.97);
  }

  @media(max-width:720px){
    .digiy-floating-welcome{
      position:fixed;
      right:12px;
      bottom:76px;
      z-index:99999;
      padding:7px;
      border-radius:999px;
      max-width:calc(100vw - 24px);
    }

    .digiy-welcome-main{
      padding:13px 16px;
      font-size:16px;
    }

    .digiy-welcome-stop{
      width:44px;
      height:44px;
    }
  }
</style>

<script>
  const DIGIY_WELCOME_TEXT = `
Bienvenue dans diji laïfe.
Tu es au bon endroit.

Ici, tu n’es pas dans une plateforme qui prend ton client.
Tu entres dans une architecture simple pour mettre ton activité dans ta main.

Ton module t’aide à présenter ton métier, recevoir les demandes, organiser ton travail,
préparer tes messages, et garder le contact direct avec tes clients.

diji i ne prend pas de commission sur ton travail.
Ton nom reste ton nom.
Ton argent reste ton argent.
Ton client reste ton client.

Choisis ton abonnement tranquillement.
Suis les étapes.
Puis envoie ta preuve de paiement.

Ton accès sera préparé proprement.

Bienvenue dans la famille diji i.
On avance pierre par pierre, avec confiance.
  `;

  function digiySpeakWelcome(){
    if (!("speechSynthesis" in window)) {
      alert("La lecture audio n'est pas disponible sur ce téléphone.");
      return;
    }

    window.speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(DIGIY_WELCOME_TEXT);
    msg.lang = "fr-FR";
    msg.rate = 0.9;
    msg.pitch = 1;

    window.speechSynthesis.speak(msg);
  }

  function digiyStopWelcome(){
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  }

  window.addEventListener("beforeunload", digiyStopWelcome);
</script>
